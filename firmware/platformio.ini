; Tendra Hand firmware: ESP32-S3-N16R8 (16 MB flash, 8 MB octal PSRAM)
;
; Build:   pio run                       (from this folder)
; Flash:   pio run -t upload
; Monitor: pio device monitor
;
; IMPORTANT: PSRAM stays DISABLED. On the N16R8 the octal PSRAM is wired to GPIO 35-37,
; which drive motors 6 and 7. Never add -DBOARD_HAS_PSRAM or memory_type = qio_opi.

[env:tendra_s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_qspi

monitor_speed = 921600
monitor_filters = send_on_enter
monitor_echo = yes

build_flags =
    -DARDUINO_USB_MODE=1          ; native USB (USB-C) as serial port
    -DARDUINO_USB_CDC_ON_BOOT=1   ; Serial = USB CDC, not UART0 (GPIO 43 drives motor 8)
    -std=gnu++17
build_unflags = -std=gnu++11
