; Tendra Hand firmware: ESP32-S3-N16R8 (16 MB flash, 8 MB octal PSRAM)
;
; Two build environments share one code base:
;   tendra_s3       v0 hand:  8 joints, 28BYJ-48 steppers + ULN2003   (include/config.h)   [default]
;   hand_v1_servo   v1 hand: 21 joints, Feetech SCS0009 servos on a TTL bus via the FE-URT-1
;                   (include/config_v1.h)
;
; Build:   pio run                        (default env only: v0)
;          pio run -e hand_v1_servo       (v1)
; Flash:   pio run -t upload              (add -e hand_v1_servo for v1)
; Monitor: pio device monitor
;
; IMPORTANT: PSRAM stays DISABLED. On the N16R8 the octal PSRAM is wired to GPIO 35-37,
; which drive motors 6 and 7 of the v0 hand. Never add -DBOARD_HAS_PSRAM or memory_type = qio_opi
; to tendra_s3. (v1 does not use those pins, but doesn't need PSRAM either.)

[platformio]
default_envs = tendra_s3

[common]
build_flags =
    -DARDUINO_USB_MODE=1          ; native USB (USB-C) as serial port
    -DARDUINO_USB_CDC_ON_BOOT=1   ; Serial = USB CDC, not UART0 (GPIO 43 drives motor 8 on v0)
    -std=gnu++17

[env:tendra_s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_qspi

monitor_speed = 921600
monitor_filters = send_on_enter
monitor_echo = yes

build_flags = ${common.build_flags}
build_unflags = -std=gnu++11
build_src_filter = +<*> -<scs0009_servo.cpp> -<scs_bus.cpp>

[env:hand_v1_servo]
extends = env:tendra_s3
build_flags =
    ${common.build_flags}
    -DTENDRA_HAND_V1
build_src_filter = +<*> -<uln2003_stepper.cpp>
