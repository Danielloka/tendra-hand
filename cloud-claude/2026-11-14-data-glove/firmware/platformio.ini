; Tendra glove firmware: two builds from one tree.
;   glove   custom pod board, ESP32-S3-MINI-1-N8 (8 MB quad flash, no PSRAM)  src/glove/
;   dongle  Seeed XIAO ESP32-S3 (stock), ESP-NOW <-> USB CDC bridge         src/dongle/
; Shared headers (protocol, CRC, COBS, SensorMap) live in include/.
;
; Build:   pio run -e glove      |  pio run -e dongle
; Flash:   pio run -e glove -t upload
; Host tests (no hardware): see test/host/test_protocol.cpp
;
; Platform pinned: arduino-esp32 3.3.x / ESP-IDF 5.5 (ESP-NOW callbacks and peer rate API used
; here are the IDF 5.5 signatures).

[platformio]
default_envs = glove

[common]
platform = espressif32@8.0.0
framework = arduino
monitor_speed = 921600
build_unflags = -std=gnu++11 -std=gnu++2b
build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=1          ; native USB-Serial/JTAG as the Serial port
    -DARDUINO_USB_CDC_ON_BOOT=1   ; Serial = USB CDC (never UART0: GPIO43/44 are debug pads)
    -Wall -Wextra

[env:glove]
platform = ${common.platform}
framework = ${common.framework}
board = esp32-s3-devkitc-1
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
board_build.arduino.memory_type = qio_qspi   ; MINI-1-N8: quad flash, no PSRAM
monitor_speed = ${common.monitor_speed}
build_unflags = ${common.build_unflags}
build_flags = ${common.build_flags} -DTENDRA_GLOVE
build_src_filter = +<glove/>

[env:dongle]
platform = ${common.platform}
framework = ${common.framework}
board = seeed_xiao_esp32s3
monitor_speed = ${common.monitor_speed}
build_unflags = ${common.build_unflags}
build_flags = ${common.build_flags} -DTENDRA_DONGLE
build_src_filter = +<dongle/>
