[project]
name = "tendra-hand"
version = "0.1.0"
description = "Open-source tendon-driven robotic hand: simulation, control and AI"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mujoco>=3.3",
    "numpy>=2.0",
    "pyserial>=3.5",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
teleop = [
    "fast-simplification>=0.2.0",
    "mediapipe>=1.0.1",
]
train = [
    "torch>=2.5",  # CPU build from PyPI on Windows; for a CUDA GPU see pytorch.org
]
arm = [
    # OpenArm's MuJoCo model (Apache-2.0): the shoulder and elbow for tendra.arm. Pinned: the
    # arm code relies on its body and joint names.
    "openarm-mujoco==2.3.0",
]
gpu = [
    # The GPU training env (software/tendra/gpu) on this laptop's CPU, for its tests:
    # `uv run --group gpu pytest software/tests/test_gpu_env.py`. Not default (~1 GB). Colab
    # installs the CUDA build itself (sim/colab/make_train_notebook.py). Brax 0.14 needs jax < 0.10.
    "mujoco-mjx==3.14.*",
    "jax[cpu]==0.9.*",
    "warp-lang",
    "mujoco-warp",
    "playground",
    "brax==0.14.*",
]

[tool.uv]
# `uv run` / `uv sync` install these groups by default (teleop: webcam hand tracking,
# train: PyTorch for sim/train_grasp.py, arm: the OpenArm model).
default-groups = ["dev", "teleop", "train", "arm"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The importable package `tendra` lives in software/tendra.
packages = ["software/tendra"]

[tool.pytest.ini_options]
testpaths = ["sim/tests", "software/tests", "hardware/cad/tests"]
cache_dir = ".venv/.pytest_cache"  # keep the repo root tidy

[tool.ruff]
line-length = 100
target-version = "py312"
cache-dir = ".venv/.ruff_cache"  # keep the repo root tidy
